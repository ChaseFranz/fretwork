  :root[data-bs-theme="dark"] { color-scheme: dark; --bg:#1a1920; --text:#e4e2ea; --dim:#a3a1ad; --brand:#e879e8; --link:#5eaee8; --rule:#3b3945; }

  th { color:var(--dim); font-size:13px; font-weight:600; }
  td small { color:var(--dim); font-size:12px; display:block; }
  td .tier { color:var(--dim); font-weight:400; font-size:12px; }
