<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
__BASE__
<title>__TITLE__</title>
<link rel="icon" href="__FAVICON__" type="image/svg+xml">
__META__
__THEME__
<!-- The one template for the site's document pages (about, changelog, methodology).
     Self-contained on purpose: these pages answer "is this the official site?",
     "can I download songs here?" and "what is in it?", so they should still
     render if the app's stylesheet, its scripts or its data are broken or missing. -->
<style>
  /* the app's roles and values (static/css/app.css), repeated here so the page
     stands alone: the ground, the text, the dim, the brand for headings, the
     link colour for links, the rule; light and dark, chosen the way the app
     chooses (the script above) */
  :root { color-scheme: light; --bg:#fbfafd; --text:#232030; --dim:#5f5b6b; --brand:#9a189a; --link:#1a67b0; --rule:#d3cfdc; }
  :root[data-bs-theme="dark"] { color-scheme: dark; --bg:#1a1920; --text:#e4e2ea; --dim:#a3a1ad; --brand:#e879e8; --link:#5eaee8; --rule:#3b3945; }
  body { margin:0; background:var(--bg); color:var(--text); padding:40px 20px 60px;
         font:15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:64ch; margin:0 auto; }
  h1 { font-size:1.15rem; font-weight:600; margin:0 0 .35rem; }
  .back { font-size:13px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px;
       color:var(--brand); margin:2rem 0 .4rem; }
  p { margin:0; }
  p.totals { color:var(--dim); font-size:13px; margin-bottom:.5rem; }
  p.item { margin:0 0 .5rem; }
  h2 a { color:inherit; text-decoration:none; }
  h2 a:hover { text-decoration:underline; }
  hr { border:0; border-top:1px solid var(--rule); margin:2.5rem 0 1.25rem; }
  ul { margin:0; padding:0; list-style:none; font-size:13px; }
  li { margin:.35rem 0; }
  a { color:var(--link); }
  footer { margin-top:1.5rem; font-size:12px; color:var(--dim); }
  /* The rendered methodology (web/markdown.py), scoped so the other document
     pages do not change: its own title is the first h2 and must read larger
     than the sections under it, which the uppercase h2 rule above would invert. */
  .source { font-size:13px; color:var(--dim); margin:0 0 1.5rem; }
  .md h2 { font-size:1.05rem; font-weight:600; text-transform:none; letter-spacing:0;
           color:inherit; margin:2rem 0 .5rem; }
  .md h3 { font-size:.95rem; font-weight:600; margin:1.5rem 0 .4rem; }
  .md h4 { font-size:.9rem; font-weight:600; margin:1.2rem 0 .3rem; }
  .md h5 { font-size:.85rem; font-weight:600; color:var(--dim); margin:1rem 0 .3rem; }
  .md p { margin:0 0 .8rem; }
  .md blockquote { margin:.8rem 0; padding:0 0 0 1rem; border-left:3px solid var(--dim);
                   color:var(--dim); }
  .md .tbl, .md .eq { overflow-x:auto; margin:.8rem 0; }
  .md table { border-collapse:collapse; font-size:14px; }
  .md th, .md td { padding:.2rem .7rem .2rem 0; border-bottom:1px solid var(--rule); }
  .md th { text-align:left; color:var(--dim); font-size:13px; }
  .md .r { text-align:right; }
  .md .c { text-align:center; }
  .md code { font-size:.9em; }
  /* The library page (section 20): tables of counts and a bar per tier, the
     bar a span of the brand colour, so the page stays a document with no script. */
  .lib p.intro { margin:0 0 .5rem; }
  .lib p.note { color:var(--dim); font-size:13px; margin:0 0 .5rem; }
  .lib h3 { font-size:.95rem; font-weight:600; margin:1rem 0 .3rem; }
  .lib .tbl { overflow-x:auto; margin:.5rem 0 1rem; }
  .lib table { border-collapse:collapse; font-size:14px; min-width:100%; }
  .lib th, .lib td { padding:.25rem .7rem .25rem 0; border-bottom:1px solid var(--rule); vertical-align:top; }
  .lib th { text-align:left; color:var(--dim); font-size:13px; }
  .lib .r { text-align:right; }
  .lib small { color:var(--dim); font-size:12px; }
  .lib td small { display:block; }
  /* the pages that are tables (the library, the games, the lists) get a wider measure than the prose pages */
  main:has(.lib) { max-width:84ch; }
  .lib .nw { white-space:nowrap; }
  .lib .bar { display:block; height:.75em; margin-top:.3em; background:var(--brand); border-radius:2px; }
  .lib td:has(.bar) { width:45%; min-width:120px; }
  /* the songs index: a plain list, the artist dimmed */
  .lib ul.songs { font-size:14px; margin:0 0 1rem; }
  .lib ul.songs li { margin:.15rem 0; }
  .lib ul.songs .by { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>__BRAND__</h1>
  <p class="back"><a href="./">__BACK__</a></p>
  __BODY__
  <hr>
  <ul>__LINKS__</ul>
  <footer>__COPYRIGHT__ <a href="__LICENSE_URL__">__LICENSE_LABEL__</a></footer>
</main>
</body>
</html>
