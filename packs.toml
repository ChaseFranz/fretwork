[[change]]
date = 2026-09-19
text = "Drums and vocals are scored: two more sheets, a graph per chart drawn from hands, travel and kicks or from pitch movement, syllables and percussion, a column each on every game page and lists of their own. Drums are rated at the single-pedal reading, with the double-pedal D beside it. The engine's fret formula moved to version 2 (a stamina term, the medians over active windows only), so every guitar, bass and keys D, tier and percentile changed with this update."
